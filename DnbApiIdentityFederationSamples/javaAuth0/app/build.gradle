plugins {
    id 'application'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'com.microsoft.azure:msal4j:[1.26.0,1.27.0)'
    implementation 'com.auth0:auth0:[5.5.0,6.0.0)'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(27)
    }
}

application {
    mainClass = 'App'
}